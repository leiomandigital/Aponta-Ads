<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7a1332" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ApontaAds" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>ApontaAds</title>
    <script>
      // Aplica a classe "dark" antes do primeiro paint, para não piscar o
      // tema claro antes do React montar (ThemeProvider assume a partir daqui).
      (function () {
        try {
          // Padrão do sistema é claro. Só vira escuro se o usuário salvou
          // "dark" explicitamente, ou "system" e a máquina preferir escuro.
          var tema = localStorage.getItem('apontaads-theme') || 'light';
          var prefereDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var escuro = tema === 'dark' || (tema === 'system' && prefereDark);
          if (escuro) document.documentElement.classList.add('dark');
        } catch (erro) {
          // localStorage indisponível — mantém o tema claro padrão
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
